<!--=====================================
Top Categoríes
======================================-->

@if (!cargando) {
  <div class="ps-top-categories">
    <div class="container">
      <h3>Top categories of the month</h3>
      <div class="row">
        @for (category of categories; track category) {
          <div class="col-xl-2 col-lg-3 col-sm-4 col-6">
            <div class="ps-block--category">
              <a class="ps-block__overlay" routerLink="products/{{ category.url }}"></a>
              <img src="{{ path }}img/categories/{{ category.image }}" alt="" />
              <p>{{ category.name }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
<!-- End Top Categories -->

<!--=====================================
  Preload
  ======================================-->

@if (cargando) {
  <div class="d-flex justify-content-center">
    <!-- <div class="spinner-border text-muted my-5"></div> -->
    <div class="container">
      <div class="row">
        @for (precat of preCategories; track precat) {
          <div class="col-xl-2 col-lg-3 col-sm-4 col-6">
            <div class="ph-item">
              <div class="ph-col-12">
                <div class="ph-picture"></div>
              </div>
              <div class="ph-col-12">
                <div class="ph-row">
                  <div class="ph-col-12 big"></div>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
