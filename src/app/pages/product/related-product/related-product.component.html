<!--=====================================
Related products
======================================-->

@if (!preload) {
  <div class="ps-section--default">
    <div class="ps-section__header">
      <h3>Related products</h3>
    </div>
    <div class="ps-section__content">
      <swiper-container [config]="swiperConfig" class="ps-carousel--nav">
        @for (product of products; track product; let i = $index; let lastIndex = $last) {
          <swiper-slide>
            <div class="ps-product">
            <div class="ps-product__thumbnail">
              <a href="product/{{ product.url }}">
                <img
                  src="{{ path }}img/products/{{ product.category }}/{{ product.image }}"
                  alt="{{ product.name }}"
                />
              </a>
              <div [innerHTML]="price[i][1]"></div>
              <ul class="ps-product__actions">
                <li>
                  <a
                    style="cursor: pointer"
                    (click)="addShoppingCart(product.url, 1, [])"
                    data-toggle="tooltip"
                    data-placement="top"
                    title="Add to Cart"
                  >
                    <i class="icon-bag2"></i>
                  </a>
                </li>
                <li>
                  <a
                    href="product/{{ product.url }}"
                    data-toggle="tooltip"
                    data-placement="top"
                    title="Quick View"
                  >
                    <i class="icon-eye"></i>
                  </a>
                </li>
                <li>
                  <a
                    style="cursor: pointer"
                    (click)="addWishlist(product.url)"
                    data-toggle="tooltip"
                    data-placement="top"
                    title="Add to Whishlist"
                  >
                    <i class="icon-heart"></i>
                  </a>
                </li>
              </ul>
            </div>
            <div class="ps-product__container">
              <a class="ps-product__vendor" href="#">{{ product.store }}</a>
              <div class="ps-product__content">
                <a class="ps-product__title" href="product/{{ product.url }}">{{ product.name }}</a>
                <div class="ps-product__rating">
                  <star-rating [value]="rating[i]" [totalStars]="5" [readOnly]="true" [color]="'#FFB400'"></star-rating>
                </div>
                <div [innerHTML]="price[i][0]"></div>
              </div>
              <div class="ps-product__content hover">
                <a class="ps-product__title" href="product/{{ product.url }}">{{ product.name }}</a>
                <div [innerHTML]="price[i][0]"></div>
              </div>
            </div>
            {{ lastIndex ? callback() : '' }}
            </div>
          </swiper-slide>
        }
      </swiper-container>
    </div>
  </div>
}
<!-- End Related products -->

<!--=====================================
  Preload
  ======================================-->
@if (preload) {
  <div class="d-flex justify-content-center">
    <div class="spinner-border text-muted my-5"></div>
  </div>
}
